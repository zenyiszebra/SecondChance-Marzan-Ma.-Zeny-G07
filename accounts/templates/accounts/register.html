{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-header card-header-sc"><h5 class="mb-0">Create an account</h5></div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include '_form.html' %}
          <button type="submit" class="btn btn-sc w-100">Register</button>
        </form>
        <p class="text-center mt-3 mb-0">Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
