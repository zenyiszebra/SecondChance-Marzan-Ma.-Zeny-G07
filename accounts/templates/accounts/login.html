{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header card-header-sc"><h5 class="mb-0">Log in</h5></div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include '_form.html' %}
          {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
          <button type="submit" class="btn btn-sc w-100">Log in</button>
        </form>
        <p class="text-center mt-3 mb-0">No account yet? <a href="{% url 'accounts:register' %}">Register</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
