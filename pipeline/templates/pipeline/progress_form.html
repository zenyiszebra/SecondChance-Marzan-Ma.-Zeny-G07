{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-header card-header-sc">
        <h5 class="mb-0">{{ title }}</h5>
        <small>{{ inmate.full_name }} ({{ inmate.inmate_number }})</small>
      </div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include '_form.html' %}
          <button type="submit" class="btn btn-sc">Save</button>
          <a class="btn btn-outline-secondary" href="{{ inmate.get_absolute_url }}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
