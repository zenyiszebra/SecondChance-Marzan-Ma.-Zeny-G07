{% extends 'base.html' %}
{% block title %}Delete stage record{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-header bg-danger text-white"><h5 class="mb-0">Delete stage record</h5></div>
      <div class="card-body">
        <p>Delete the <strong>{{ record.get_stage_display }}</strong> record of <strong>{{ record.inmate.full_name }}</strong>? This cannot be undone.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a class="btn btn-outline-secondary" href="{{ record.inmate.get_absolute_url }}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
